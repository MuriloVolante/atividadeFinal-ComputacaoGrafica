<script>
/* ===== imagem e algoritmos ===== */
function rnd(s){let x=s>>>0;return()=>{x=(x*1664525+1013904223)>>>0;return x/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function imagemTeste(sombra){
  const w=700,h=320,c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  x.fillStyle='rgb(235,235,235)';x.fillRect(0,0,w,h);
  x.fillStyle='rgb(60,60,60)';x.font='bold 46px Arial';x.textBaseline='top';
  ['LIMIARIZACAO','Otsu x Adaptativo','Pillow + NumPy'].forEach((t,i)=>x.fillText(t,30,30+i*95));
  const d=x.getImageData(0,0,w,h).data,g=new Uint8ClampedArray(w*h),r=rnd(7);
  for(let y=0;y<h;y++)for(let i=0;i<w;i++){
    const p=(y*w+i)*4,base=.299*d[p]+.587*d[p+1]+.114*d[p+2];
    const s=sombra===false?1:1-.7*(i/(w-1));
    g[y*w+i]=Math.max(0,Math.min(255,base*s+gauss(r)*3));}
  return{dados:g,w:w,h:h};
}
function histograma(im){const h=new Float64Array(256);for(let i=0;i<im.dados.length;i++)h[im.dados[i]]++;return h}
function pesosMedias(hist){
  const n=hist.reduce((a,b)=>a+b,0),p=new Float64Array(256);
  for(let i=0;i<256;i++)p[i]=hist[i]/n;
  let muT=0;for(let i=0;i<256;i++)muT+=i*p[i];
  const w0=new Float64Array(256),w1=new Float64Array(256),m0=new Float64Array(256),m1=new Float64Array(256);
  let a=0,s=0;
  for(let t=0;t<256;t++){a+=p[t];s+=t*p[t];w0[t]=a;w1[t]=1-a;
    m0[t]=a>0?s/a:0;m1[t]=(1-a)>0?(muT-s)/(1-a):0;}
  return{w0:w0,w1:w1,mu0:m0,mu1:m1};
}
function curvaOtsu(hist,nota){
  const pm=pesosMedias(hist),c=new Float64Array(256);let T=0,mx=-Infinity;
  for(let t=0;t<256;t++){let v=0;
    if(pm.w0[t]>0&&pm.w1[t]>0){try{v=nota(pm.w0[t],pm.w1[t],pm.mu0[t],pm.mu1[t])}catch(e){v=0}}
    if(!isFinite(v))v=0;c[t]=v;if(v>mx){mx=v;T=t}}
  return{curva:c,T:T,max:mx,pm:pm};
}
function aplicaGlobal(im,T,f){const o=new Uint8ClampedArray(im.dados.length);
  for(let i=0;i<o.length;i++)o[i]=f(im.dados[i],T);return{dados:o,w:im.w,h:im.h}}
function mediaCaixa(src,w,h,b){
  const r=b>>1,I=new Float64Array((w+1)*(h+1));
  for(let y=0;y<h;y++){let l=0;for(let x=0;x<w;x++){l+=src[y*w+x];I[(y+1)*(w+1)+x+1]=I[y*(w+1)+x+1]+l}}
  const o=new Float64Array(w*h);
  for(let y=0;y<h;y++){const y0=Math.max(0,y-r),y1=Math.min(h,y+r+1);
    for(let x=0;x<w;x++){const x0=Math.max(0,x-r),x1=Math.min(w,x+r+1);
      o[y*w+x]=(I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0])/((y1-y0)*(x1-x0))}}
  return o;
}
function caixasGauss(s,n){const id=Math.sqrt(12*s*s/n+1);let wl=Math.floor(id);if(wl%2===0)wl--;
  const wu=wl+2,mi=(12*s*s-n*wl*wl-4*n*wl-3*n)/(-4*wl-4),m=Math.round(mi),r=[];
  for(let i=0;i<n;i++)r.push(i<m?wl:wu);return r}
function mediaLocal(im,b,met){
  if(met!=='gauss')return mediaCaixa(im.dados,im.w,im.h,b);
  const s=.3*((b-1)*.5-1)+.8;if(s<=.3)return Float64Array.from(im.dados);
  let cur=Float64Array.from(im.dados);
  caixasGauss(s,3).forEach(k=>{cur=mediaCaixa(cur,im.w,im.h,Math.max(3,k))});return cur;
}
function aplicaAdapt(im,b,C,met,f){
  const loc=mediaLocal(im,b,met),o=new Uint8ClampedArray(im.dados.length);
  for(let i=0;i<o.length;i++)o[i]=f(im.dados[i],loc[i],C);
  return{dados:o,w:im.w,h:im.h,local:loc};
}
function pinta(cv,im){cv.width=im.w;cv.height=im.h;
  const ctx=cv.getContext('2d'),id=ctx.createImageData(im.w,im.h);
  for(let i=0,j=0;i<im.dados.length;i++,j+=4){const v=im.dados[i];id.data[j]=id.data[j+1]=id.data[j+2]=v;id.data[j+3]=255}
  ctx.putImageData(id,0,0)}

/* grafico com eixos */
function grafico(cv,hist,o){
  o=o||{};const W=cv.width,H=cv.height,c=cv.getContext('2d');
  const ml=74,mr=18,mt=18,mb=46,pw=W-ml-mr,ph=H-mt-mb;
  const X=i=>ml+i/255*pw;
  c.clearRect(0,0,W,H);c.fillStyle='#fff';c.fillRect(0,0,W,H);
  const pico=Math.max.apply(null,Array.from(hist))||1;
  c.strokeStyle='#DFE4EA';c.lineWidth=1;
  for(let k=1;k<=4;k++){const y=mt+ph-ph*k/4;c.beginPath();c.moveTo(ml,y);c.lineTo(ml+pw,y);c.stroke()}
  const pa=pw/256;
  c.fillStyle=o.corBarra||'#8B94A3';
  for(let i=0;i<256;i++){const a=hist[i]/pico*ph;c.fillRect(X(i),mt+ph-a,Math.max(1,pa+.4),a)}
  if(o.curva){
    const pc=Math.max.apply(null,Array.from(o.curva))||1;
    c.beginPath();for(let i=0;i<256;i++){const y=mt+ph-o.curva[i]/pc*ph;i?c.lineTo(X(i),y):c.moveTo(X(i),y)}
    c.strokeStyle='#0E7A45';c.lineWidth=3;c.stroke();
    c.lineTo(X(255),mt+ph);c.lineTo(X(0),mt+ph);c.closePath();
    c.globalAlpha=.14;c.fillStyle='#0E7A45';c.fill();c.globalAlpha=1;
  }
  if(o.otsuT!==undefined){c.strokeStyle='#0E7A45';c.lineWidth=2.5;c.setLineDash([7,5]);
    c.beginPath();c.moveTo(X(o.otsuT),mt);c.lineTo(X(o.otsuT),mt+ph);c.stroke();c.setLineDash([])}
  if(o.T!==undefined){c.strokeStyle='#1552E0';c.lineWidth=3;
    c.beginPath();c.moveTo(X(o.T),mt);c.lineTo(X(o.T),mt+ph);c.stroke();
    c.fillStyle='#1552E0';c.beginPath();c.arc(X(o.T),mt,6,0,7);c.fill()}
  c.strokeStyle='#2E3744';c.lineWidth=2;
  c.beginPath();c.moveTo(ml,mt);c.lineTo(ml,mt+ph);c.lineTo(ml+pw,mt+ph);c.stroke();
  c.fillStyle='#2E3744';c.font='600 14px Segoe UI,Arial,sans-serif';c.textAlign='center';
  [0,64,128,192,255].forEach(v=>{c.beginPath();c.moveTo(X(v),mt+ph);c.lineTo(X(v),mt+ph+6);c.stroke();
    c.fillText(v,X(v),mt+ph+25)});
  c.textAlign='right';c.font='600 13px Segoe UI,Arial,sans-serif';
  for(let k=0;k<=4;k++){const y=mt+ph-ph*k/4;c.fillText(Math.round(pico*k/4).toLocaleString('pt-BR'),ml-12,y+5)}
  c.save();c.translate(20,mt+ph/2);c.rotate(-Math.PI/2);c.textAlign='center';
  c.font='700 13px Segoe UI,Arial,sans-serif';c.fillStyle='#2E3744';
  c.fillText(o.rotuloY||'QUANTIDADE DE PIXELS',0,0);c.restore();
  c.textAlign='center';c.font='700 13px Segoe UI,Arial,sans-serif';
  c.fillText(o.rotuloX||'TOM DO PIXEL   ( 0 = PRETO   ·   255 = BRANCO )',ml+pw/2,H-8);
}

const FONTES={

`// Roda uma vez para CADA pixel da imagem.
// pixel: o tom lido, de 0 (preto) a 255 (branco)
// T: o limiar escolhido no controle
// Devolva 255 para branco ou 0 para preto.

function limiarGlobal(pixel, T) {
  if (pixel > T) {
    return 255
  }
  return 0
}
`},
globalPy:{nome:'limiar_global.py',lang:'py',ro:true,src:
`"""Limiarizacao global: um unico corte T para a imagem inteira.

Instalar:  pip install pillow numpy
Rodar:     python limiar_global.py documento.jpg
"""

import sys

import numpy as np
from PIL import Image


def carregar_cinza(caminho):
    """Abre a imagem e converte para tons de cinza (modo L: 0 a 255)."""
    return np.array(Image.open(caminho).convert("L"), dtype=np.uint8)


def limiar_global(cinza, T):
    """Pixel > T vira branco (255); senao, preto (0).

    Uma unica comparacao vetorizada sobre a matriz inteira:
    nao existe laco sobre pixels.
    """
    return np.where(cinza > T, 255, 0).astype(np.uint8)


def main():
    caminho = sys.argv[1] if len(sys.argv) > 1 else "documento.jpg"
    cinza = carregar_cinza(caminho)

    for T in (60, 100, 140, 180):
        binaria = limiar_global(cinza, T)
        Image.fromarray(binaria).save(f"global_T{T}.png")
        brancos = (binaria == 255).mean() * 100
        print(f"T = {T:3d}  ->  {brancos:5.1f}% dos pixels ficaram brancos")


if __name__ == "__main__":
    main()
`},
otsu:{nome:'nota_do_corte.js',lang:'js',src:
`// Roda uma vez para CADA corte T, de 0 a 255.
// w0, w1: fracao de pixels no grupo escuro e no grupo claro
// mu0, mu1: tom medio de cada grupo

`"""Algoritmo de Otsu: o proprio histograma escolhe o corte.

Instalar:  pip install pillow numpy
Rodar:     python otsu.py documento.jpg
"""

import sys

import numpy as np
from PIL import Image


def carregar_cinza(caminho):
    return np.array(Image.open(caminho).convert("L"), dtype=np.uint8)


def otsu(cinza):
    """Testa os 256 cortes e devolve o que MAXIMIZA a variancia entre
    classes:  sigma_B(T) = w0 * w1 * (mu0 - mu1) ** 2
    """
    hist = np.bincount(cinza.ravel(), minlength=256)   # pixels de cada tom
    p = hist / hist.sum()                              # probabilidade de cada tom
    niveis = np.arange(256)

    omega0 = np.cumsum(p)                  # fracao de pixels com tom <= T
    omega1 = 1.0 - omega0                  # fracao com tom > T
    soma = np.cumsum(p * niveis)           # soma de i * p_i ate T
    mu_total = soma[-1]                    # media de toda a imagem

    with np.errstate(divide="ignore", invalid="ignore"):
        mu0 = soma / omega0                        # media do grupo escuro
        mu1 = (mu_total - soma) / omega1           # media do grupo claro
        sigma_b = omega0 * omega1 * (mu0 - mu1) ** 2

    sigma_b = np.nan_to_num(sigma_b)       # cortes com um grupo vazio viram 0
    T = int(np.argmax(sigma_b))            # o corte de maior nota
    return T, sigma_b


def main():
    caminho = sys.argv[1] if len(sys.argv) > 1 else "documento.jpg"
    cinza = carregar_cinza(caminho)

    T, sigma_b = otsu(cinza)
    print(f"Corte escolhido pelo Otsu: T = {T}")
    print(f"Nota desse corte: {sigma_b[T]:.1f}")

    binaria = np.where(cinza > T, 255, 0).astype(np.uint8)
    Image.fromarray(binaria).save("otsu.png")


if __name__ == "__main__":
    main()
`},

`"""Limiarizacao adaptativa: um corte diferente para cada pixel.

bloco e C nao sao o corte: sao os dois parametros que VOCE escolhe.
O corte de cada pixel e calculado como  media_dos_vizinhos - C.

Instalar:  pip install pillow numpy
Rodar:     python adaptativo.py documento.jpg
"""

import sys

import numpy as np
from PIL import Image, ImageFilter


def carregar_cinza(caminho):
    return np.array(Image.open(caminho).convert("L"), dtype=np.uint8)


def media_local(cinza, bloco):
    """Media simples de cada janela bloco x bloco, pela IMAGEM INTEGRAL:
    a soma de qualquer retangulo sai com 4 acessos, seja qual for o bloco.
    """
    r = bloco // 2
    pad = np.pad(cinza.astype(np.float64), r, mode="edge")
    integral = pad.cumsum(axis=0).cumsum(axis=1)
    integral = np.pad(integral, ((1, 0), (1, 0)))
    h, w = cinza.shape
    soma = (integral[bloco:bloco + h, bloco:bloco + w]
            - integral[0:h, bloco:bloco + w]
            - integral[bloco:bloco + h, 0:w]
            + integral[0:h, 0:w])
    return soma / (bloco * bloco)


def media_ponderada(cinza, bloco):
    """Media ponderada por uma gaussiana: os vizinhos mais proximos do
    centro pesam mais. O sigma vem do tamanho do bloco.
    """
    sigma = 0.3 * ((bloco - 1) * 0.5 - 1) + 0.8
    borrada = Image.fromarray(cinza).filter(ImageFilter.GaussianBlur(radius=sigma))
    return np.array(borrada, dtype=np.float64)


def limiar_adaptativo(cinza, bloco=25, C=10, metodo="media"):
    """bloco: tamanho da vizinhanca, sempre impar (precisa de pixel central).
    C: folga. O pixel so vira preto se for pelo menos C tons mais escuro
    que os vizinhos dele.
    """
    if bloco % 2 == 0 or bloco < 3:
        raise ValueError("bloco precisa ser impar e >= 3")

    local = media_local(cinza, bloco) if metodo == "media" else media_ponderada(cinza, bloco)
    corte = local - C                      # um corte para CADA pixel
    return np.where(cinza > corte, 255, 0).astype(np.uint8)


def main():
    caminho = sys.argv[1] if len(sys.argv) > 1 else "documento.jpg"
    cinza = carregar_cinza(caminho)

    # 25 e 10 foram os valores que deram o melhor resultado nos nossos testes
    Image.fromarray(limiar_adaptativo(cinza, 25, 10, "media")).save("adapt_media.png")
    Image.fromarray(limiar_adaptativo(cinza, 25, 10, "gauss")).save("adapt_ponderada.png")
    print("Imagens salvas: adapt_media.png e adapt_ponderada.png")


if __name__ == "__main__":
    main()

{id:'otsu',html:`
<h2>Otsu: o computador escolhe o corte</h2>
<div class="row g40 mt24 ac">
  <div class="col g12">
    <span class="rotulo">Uma imagem de 6 pixels</span>
    <div class="row g8 ac" id="otPix"></div>
  </div>
  <div class="col g12 grow">
    <span class="rotulo">Nota de cada corte</span>
    <div class="col" id="otBar" style="gap:10px"></div>
  </div>
</div>
<table class="clicavel mt32" id="otTab" style="font-size:16px"></table>`,
init(){
  const vals=[20,40,60,180,200,220],N=6;
  const pix=document.getElementById('otPix');
  const quads=vals.map(v=>{const d=document.createElement('div');
    d.style.cssText='width:76px;height:76px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:18px;font-weight:700;border:2px solid #9BA5B4;box-shadow:var(--sh);';
    d.style.background='rgb('+v+','+v+','+v+')';d.style.color=v>128?'#1A1F28':'#EDF0F4';d.textContent=v;
    pix.appendChild(d);return d;});
  const corte=document.createElement('div');
  corte.style.cssText='width:6px;height:96px;background:var(--acc);border-radius:3px;position:absolute;box-shadow:0 2px 8px rgba(21,82,224,.5);transition:transform .28s cubic-bezier(.3,.8,.3,1)';
  pix.style.position='relative';pix.appendChild(corte);

  const L=vals.slice(0,5).map((T,i)=>{
    const e=vals.slice(0,i+1),c=vals.slice(i+1);
    const se=e.reduce((a,b)=>a+b,0),sc=c.reduce((a,b)=>a+b,0);
    const w0=e.length/N,w1=c.length/N,m0=se/e.length,m1=sc/c.length;
    return{T:T,i:i,e:e,c:c,se:se,sc:sc,w0:w0,w1:w1,m0:m0,m1:m1,nota:FN.otsu(w0,w1,m0,m1)};});
  const melhor=L.reduce((a,b)=>b.nota>a.nota?b:a),mx=melhor.nota;
  const tab=document.getElementById('otTab'),bars=document.getElementById('otBar');

  tab.innerHTML='<tr><th style="width:110px">Corte</th>'+
    '<th style="width:150px">ω₀ = n₀ / N</th><th style="width:290px">μ₀ = soma / n₀</th>'+
    '<th style="width:150px">ω₁ = n₁ / N</th><th style="width:290px">μ₁ = soma / n₁</th>'+
    '<th>Nota = ω₀ · ω₁ · (μ₀ − μ₁)²</th></tr>';

  const sel=o=>{
    tab.querySelectorAll('tr').forEach(t=>t.classList.remove('on'));
    const tr=tab.querySelector('tr[data-i="'+o.i+'"]');if(tr)tr.classList.add('on');
    bars.querySelectorAll('.bl').forEach(b=>b.style.opacity=.4);
    const bl=bars.querySelector('.bl[data-i="'+o.i+'"]');if(bl)bl.style.opacity=1;
    corte.style.transform='translate('+(quads[o.i].offsetLeft+quads[o.i].offsetWidth+1)+'px,-10px)';
  };
  L.forEach(o=>{
    const tr=document.createElement('tr');tr.dataset.i=o.i;
    const d=o.m0-o.m1, q=d*d;
    tr.innerHTML='<td class="tt">T = '+o.T+'</td>'+
      '<td class="tt" style="font-size:15px">'+o.e.length+'/'+N+' = '+fmt(o.w0,2)+'</td>'+
      '<td class="tt" style="font-size:15px">('+o.e.join('+')+') / '+o.e.length+' = '+fmt(o.m0,0)+'</td>'+
      '<td class="tt" style="font-size:15px">'+o.c.length+'/'+N+' = '+fmt(o.w1,2)+'</td>'+
      '<td class="tt" style="font-size:15px">('+o.c.join('+')+') / '+o.c.length+' = '+fmt(o.m1,0)+'</td>'+
      '<td class="tt" style="font-size:15px;line-height:1.6">'+fmt(o.w0,2)+' · '+fmt(o.w1,2)+' · ('+fmt(o.m0,0)+' − '+fmt(o.m1,0)+')²<br>= '+
      fmt(o.w0*o.w1,2)+' · '+q.toLocaleString('pt-BR')+' = <b>'+fmt(o.nota,0)+'</b></td>';
    tr.onclick=()=>sel(o);tab.appendChild(tr);
    const w=document.createElement('div');w.className='bl';w.dataset.i=o.i;
    w.style.cssText='display:flex;align-items:center;gap:12px;cursor:pointer;transition:opacity .2s';
    w.innerHTML='<span class="tt" style="width:62px;font-size:15px;color:var(--txt)">T='+o.T+'</span>'+
      '<span style="height:24px;border-radius:5px;width:'+(o.nota/mx*300)+'px;background:'+(o===melhor?'var(--acc)':'#8FCBA8')+';box-shadow:var(--sh)"></span>'+
      '<span class="tt" style="font-size:15px;font-weight:700;color:'+(o===melhor?'var(--acc)':'var(--txt)')+'">'+fmt(o.nota,0)+'</span>';
    w.onclick=()=>sel(o);bars.appendChild(w);});
  setTimeout(()=>sel(melhor),30);}},

{id:'adapt',html:`

      <rect x="6" y="6" width="52" height="52" rx="5"/>
      <path d="M6 23.3h52M6 40.6h52M23.3 6v52M40.6 6v52"/>

  <div class="card plain col g20" style="width:432px;padding:44px 40px">

</div></div>`},

{id:'adaptlab',codigo:['adapt','adaptPy'],html:`
<h2>Cada pixel comparado com a vizinhança dele</h2>

  <span class="pill" id="adPill"><span class="deslizante"></span>
    <button data-m="media" class="on">média simples</button><button data-m="gauss">média ponderada (gaussiana)</button></span>
  <span class="ctrl"><span class="nome">bloco</span>
    <input type="range" id="adB" min="3" max="151" step="2" value="25" style="width:240px"><span class="val" id="adBv">25</span></span>
  <span class="ctrl"><span class="nome">folga C</span>
    <input type="range" id="adC" min="0" max="40" value="10" style="width:210px"><span class="val" id="adCv">10</span></span>
</div>
<div class="row g32 jc">

  <div class="col g12"><span class="rotulo on">Resultado</span>
    <canvas id="adB2" class="quadro" style="width:600px;height:275px"></canvas></div>
</div>
<div class="contas jc mt24" id="adCont" style="justify-content:center"></div>`,
init(){
  const A=document.getElementById('adA'),B=document.getElementById('adB2'),ct=document.getElementById('adCont');
  const sb=document.getElementById('adB'),sc=document.getElementById('adC');
  const vb=document.getElementById('adBv'),vc=document.getElementById('adCv');
  const pill=document.getElementById('adPill'),desl=pill.querySelector('.deslizante');
  const pos=()=>{const b=pill.querySelector('button.on');desl.style.width=b.offsetWidth+'px';
    desl.style.transform='translateX('+(b.offsetLeft-4)+'px)';};
  if(!EST.pt) EST.pt={x:Math.round(EST.img.w*.88),y:Math.round(EST.img.h*.93)};
  const pt=EST.pt;
  const cel=(cab,vlr,cls)=>'<div class="conta '+(cls||'')+'"><span class="cab">'+cab+'</span><span class="vlr">'+vlr+'</span></div>';
  const orig=()=>{pinta(A,EST.img);const c=A.getContext('2d'),r=(+sb.value)>>1;
    c.strokeStyle='#1552E0';c.lineWidth=3;c.strokeRect(pt.x-r,pt.y-r,+sb.value,+sb.value);
    c.fillStyle='#1552E0';c.fillRect(pt.x-2,pt.y-2,4,4);};
  const r=()=>{
    const b=+sb.value,C=+sc.value;EST.bloco=b;EST.C=C;vb.textContent=b;vc.textContent=C;
    const res=aplicaAdapt(EST.img,b,C,EST.metodo,FN.adapt);pinta(B,res);orig();
    const i=pt.y*EST.img.w+pt.x,val=EST.img.dados[i];
    const outro=mediaLocal(EST.img,b,EST.metodo==='media'?'gauss':'media');
    const mA=res.local[i],mO=outro[i];
    const simples=EST.metodo==='media'?mA:mO,pond=EST.metodo==='media'?mO:mA;
    const tl=mA-C,branco=res.dados[i]===255,sg=fmt(.3*((b-1)*.5-1)+.8,1);
    ct.innerHTML=
      cel('pixel',val)+
      cel('média simples',fmt(simples,1),EST.metodo==='media'?'on':'')+
      cel('média ponderada (gaussiana) · sigma '+sg,fmt(pond,1),EST.metodo==='gauss'?'on':'')+
      cel('corte local = média − C',fmt(mA,1)+' − '+C+' = '+fmt(tl,1))+
      cel('decisão do adaptativo',val+(branco?' > ':' ≤ ')+fmt(tl,1)+' → '+(branco?'BRANCO':'PRETO'),'fim')+
      cel('no mesmo pixel, com o corte global T = '+EST.T,
          val+(val>EST.T?' > ':' ≤ ')+EST.T+' → '+(val>EST.T?'BRANCO':'PRETO'));};
  A.onclick=e=>{const q=A.getBoundingClientRect();
    pt.x=Math.max(0,Math.min(EST.img.w-1,Math.round((e.clientX-q.left)/q.width*EST.img.w)));
    pt.y=Math.max(0,Math.min(EST.img.h-1,Math.round((e.clientY-q.top)/q.height*EST.img.h)));r();};
  sb.oninput=r;sc.oninput=r;
  pill.onclick=e=>{const b=e.target.closest('button');if(!b||b.classList.contains('on'))return;
    pill.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    EST.metodo=b.dataset.m;pos();r();};
  sb.value=EST.bloco;sc.value=EST.C;
  pill.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.m===EST.metodo));
  setTimeout(pos,0);r();}},

{id:'obrigado',escuro:true,html:`

    </div>
  </div>
  <div class="col g16 ac" style="width:500px">
    <p class="lead" style="color:#CDD5DF;text-align:center;max-width:470px">Repositório com a apresentação e as explicações, para consulta e estudo.</p>
    <div id="qrCaixa" style="width:430px;height:430px;border-radius:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#151B24;border:2px dashed #39434F">
      <span class="sm" id="qrVazio">nenhuma imagem</span>
      <img id="qrImg" style="display:none;width:100%;height:100%;object-fit:contain;background:#fff">
    </div>
    <input type="file" id="qrFile" accept="image/*" style="display:none">
    <button class="botao forte" id="qrBt" style="width:430px;padding:16px">enviar imagem do QR code</button>
    <button class="botao" id="qrLimpa" style="width:430px;display:none">remover</button>
  </div>
</div>`,
init(){
  const cx=document.getElementById('qrCaixa'),img=document.getElementById('qrImg'),vazio=document.getElementById('qrVazio');
  const bt=document.getElementById('qrBt'),lp=document.getElementById('qrLimpa'),f=document.getElementById('qrFile');
  const mostraQR=d=>{if(!d){img.style.display='none';vazio.style.display='';cx.style.border='2px dashed #39434F';
      bt.textContent='enviar imagem do QR code';lp.style.display='none';return;}
    img.src=d;img.style.display='';vazio.style.display='none';cx.style.border='0';
    bt.textContent='trocar imagem';lp.style.display='';};
  let salvo=null;try{salvo=localStorage.getItem('qrcode')}catch(e){salvo=window.__qr||null}
  mostraQR(salvo);
  bt.onclick=()=>f.click();
  lp.onclick=()=>{try{localStorage.removeItem('qrcode')}catch(e){}window.__qr=null;mostraQR(null)};
  f.onchange=()=>{const a=f.files&&f.files[0];if(!a)return;const rd=new FileReader();
    rd.onload=()=>{const d=rd.result;window.__qr=d;try{localStorage.setItem('qrcode',d)}catch(e){}mostraQR(d)};
    rd.readAsDataURL(a);f.value='';};}}
];

/* ===== realce de sintaxe ===== */
function realca(src,lang){
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const t=esc(src);
  const re=lang==='py'
    ? /(#[^\n]*)|("""[\s\S]*?"""|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(def|class|return|import|from|as|if|elif|else|for|while|in|not|and|or|is|lambda|with|try|except|raise|pass)\b|\b(None|True|False|self|int|float|str)\b|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)(?=\s*\()/g
    : /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:[^`\\]|\\.)*`|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(if|else|return|for|while|break|continue|switch|case|try|catch|throw)\b|\b(const|let|var|function|new|typeof)\b|\b(\d+(?:\.\d+)?)\b|\b(Math|Number|Array|String|Object)\b|\b([A-Za-z_]\w*)(?=\s*\()/g;
  const cls=lang==='py'?['t-com','t-str','t-ctl','t-kw','t-num','t-fn']:['t-com','t-str','t-ctl','t-kw','t-num','t-typ','t-fn'];
  return t.replace(re,function(){
    const g=Array.prototype.slice.call(arguments,1,1+cls.length);
    for(let i=0;i<g.length;i++) if(g[i]!==undefined) return '<span class="'+cls[i]+'">'+g[i]+'</span>';
    return arguments[0];});
}

/* ===== motor ===== */
const palco=document.getElementById('palco'),btcode=document.getElementById('btcode');
const ed=document.getElementById('ed'),edabas=document.getElementById('edabas');
const edhl=document.getElementById('edhl'),edta=document.getElementById('edta');
const edst=document.getElementById('edst'),edwrap=document.getElementById('edwrap');
const cont=document.getElementById('cont');
let atual=0,abaAtiva=null,tmr=null;

function ajusta(){
  const aberto=ed.classList.contains('on');
  const disp=window.innerWidth-(aberto?ed.offsetWidth:0);
  const e=Math.min(disp/1600,window.innerHeight/900);
  palco.style.transform='translate('+((disp-1600*e)/2)+'px,-50%) scale('+e+')';
}
window.addEventListener('resize',ajusta);

function mostra(i,semAnim){
  atual=Math.max(0,Math.min(SL.length-1,i));
  const s=SL[atual];
  document.body.classList.toggle('escuro',!!s.escuro);
  palco.innerHTML='<div class="slide'+(s.escuro?' escuro':'')+(semAnim?'':' entra')+'">'+s.html+'</div>';
  if(s.init) try{s.init()}catch(e){console.error(e)}
  const tem=!!(s.codigo&&s.codigo.length);
  btcode.style.display=tem?'flex':'none';
  if(!tem) fecha(); else montaAbas(s.codigo);
  cont.textContent=(atual+1)+' / '+SL.length;
  location.hash=s.id;
}
function montaAbas(ch){
  [].slice.call(edabas.querySelectorAll('.aba')).forEach(b=>b.remove());
  if(ch.indexOf(abaAtiva)<0) abaAtiva=ch[0];
  ch.forEach(k=>{const b=document.createElement('button');
    b.className='aba'+(k===abaAtiva?' on':'');b.textContent=FONTES[k].nome;
    b.onclick=()=>{abaAtiva=k;montaAbas(ch)};
    edabas.insertBefore(b,edabas.querySelector('.fechar'));});
  carrega();
}
function carrega(){
  const f=FONTES[abaAtiva],txt=(abaAtiva in EDIT)?EDIT[abaAtiva]:f.src;
  edta.value=txt;edhl.innerHTML=realca(txt,f.lang);
  edwrap.classList.toggle('ro',!!f.ro);
  edta.readOnly=!!f.ro;
  edta.scrollTop=0;edhl.parentNode.scrollTop=0;
  edst.className='st';
  edst.textContent=f.ro?'script completo · role e copie · editar aqui não muda o slide'
    :((abaAtiva in EDIT)?'editado':'edite e o slide muda na hora');
}
function aplica(){
  const f=FONTES[abaAtiva];if(f.ro)return;
  const src=edta.value;
  if(src===f.src) delete EDIT[abaAtiva]; else EDIT[abaAtiva]=src;
  const base=abaAtiva.replace('Py','');
  try{
    FN[base]=compila(base,src);
    if(base==='otsu') EST.ot=curvaOtsu(EST.hist,FN.otsu);
    edst.className='st ok';edst.textContent='✓ aplicado';
    mostra(atual,true);
  }catch(e){edst.className='st err';edst.textContent='✗ '+e.message}
}
edta.addEventListener('input',()=>{
  edhl.innerHTML=realca(edta.value,FONTES[abaAtiva].lang);
  clearTimeout(tmr);tmr=setTimeout(aplica,380);});
edta.addEventListener('scroll',()=>{
  edhl.parentNode.scrollTop=edta.scrollTop;edhl.parentNode.scrollLeft=edta.scrollLeft;});
edta.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();const i=edta.selectionStart;
    edta.setRangeText('  ',i,edta.selectionEnd,'end');edta.dispatchEvent(new Event('input'));}});
document.getElementById('edreset').onclick=()=>{
  const base=abaAtiva.replace('Py','');
  delete EDIT[abaAtiva];FN[base]=PADRAO[base];
  if(base==='otsu') EST.ot=curvaOtsu(EST.hist,FN.otsu);
  carrega();mostra(atual,true);edta.focus();};
function abre(){ed.classList.add('on');btcode.classList.add('on');ajusta()}
function fecha(){ed.classList.remove('on');btcode.classList.remove('on');ajusta()}
btcode.onclick=()=>ed.classList.contains('on')?fecha():abre();
document.getElementById('edfechar').onclick=fecha;

/* unica navegacao: setas, espaco e os botoes do apresentador */
document.addEventListener('keydown',e=>{
  const t=e.target.tagName;
  if(t==='TEXTAREA'||t==='INPUT') return;
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();mostra(atual+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();mostra(atual-1)}
});

ajusta();
const h=SL.findIndex(s=>s.id===location.hash.slice(1));
mostra(h>=0?h:0,true);
</script>
